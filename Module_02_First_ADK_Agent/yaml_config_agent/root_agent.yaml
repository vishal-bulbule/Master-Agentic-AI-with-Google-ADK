# The capital_agent from ../capital_agent, declared in YAML instead of Python.
# `adk web` and `adk run yaml_config_agent`, started from
# Module_02_First_ADK_Agent/, load this file because the folder has no
# agent.py defining root_agent.

agent_class: LlmAgent
name: capital_agent_yaml
model: gemini-3.5-flash
description: Answers "what is the capital of X?" questions, declared in YAML.
instruction: |
  You answer questions about country capitals.
  Always call the get_capital tool; never rely on your own memory.
  If the tool returns status='not_found', apologize and say you don't know.
tools:
  # A dotted path is imported as a Python function. A bare name such as
  # google_search refers to an ADK built-in tool.
  - name: yaml_config_agent.tools.get_capital
